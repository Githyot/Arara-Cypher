name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Testes do núcleo (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test -p araracypher-core
      - run: cargo clippy -p araracypher-core -- -D warnings

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Dependências
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake make rust cargo rpm-build
          qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Empacotar .rpm
        working-directory: build
        run: cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: araracypher-fedora-rpm
          path: build/*.rpm
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      QT_VERSION: "6.8.3"
      NDK_VERSION: "26.1.10909125"   # NDK oficial do Qt 6.8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Qt para desktop (ferramentas do host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          cache: true

      - name: Qt para Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/qt-android
          cache: true

      - name: Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          QT_HOST="${{ runner.temp }}/qt-host/Qt/${QT_VERSION}/gcc_64"
          QT_ANDROID="${{ runner.temp }}/qt-android/Qt/${QT_VERSION}/android_arm64_v8a"
          "$QT_ANDROID/bin/qt-cmake" -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build-android -j"$(nproc)" --target apk

      - name: Assinar APK (chave de teste)
        # Chave descartável gerada a cada build: dá para instalar o APK no
        # celular, mas cada build novo precisa desinstalar o anterior.
        # Uma chave fixa vai para os segredos do repositório quando for publicar.
        run: |
          APK=$(find build-android -name "*-release-unsigned.apk" -o -name "*-release.apk" | head -1)
          echo "APK gerado: $APK"
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias araracypher -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AraraCypher Debug"
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android --out AraraCypher-arm64.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: araracypher-android-apk
          path: AraraCypher-arm64.apk
          if-no-files-found: error
